<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>
  
  <!-- Content Group -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Calendar Header Card -->
    <rect x="0" y="25" width="300" height="250" rx="24" fill="#ffffff"/>
    <path d="M 0 49 C 0 35.7 10.7 25 24 25 L 276 25 C 289.3 25 300 35.7 300 49 L 300 90 L 0 90 Z" fill="#0284c7"/>
    
    <!-- Rings -->
    <rect x="60" y="5" width="20" height="40" rx="10" fill="#f8fafc"/>
    <rect x="220" y="5" width="20" height="40" rx="10" fill="#f8fafc"/>
    
    <!-- Shield / Check badge -->
    <path d="M 150 115 L 210 140 L 210 190 C 210 225 150 250 150 250 C 150 250 90 225 90 190 L 90 140 Z" fill="#16a34a"/>
    <path d="M 130 180 L 145 195 L 175 165" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
